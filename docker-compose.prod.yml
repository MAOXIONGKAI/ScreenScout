services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: screenscout_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screenscout}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-screenscout}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - screenscout_net

  redis:
    image: redis:7-alpine
    container_name: screenscout_prod_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - screenscout_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: screenscout_prod_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-screenscout}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-screenscout-super-secret-key-prod-2026}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085/api/notify
      NOTIFICATION_STREAM_NAME: screenscout:notifications:stream
      CACHE_MOVIE_LIST_TTL: 5m
      CACHE_MOVIE_DETAIL_TTL: 10m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - screenscout_net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: screenscout_prod_notif
    restart: always
    command: python notification_service/main.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-screenscout}
      REDIS_URL: redis://redis:6379
      PORT: 8085
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOTIFICATION_STREAM_NAME: screenscout:notifications:stream
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - screenscout_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screenscout_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: https://screenscout.live
    depends_on:
      - backend
    networks:
      - screenscout_net

  nginx:
    image: nginx:alpine
    container_name: screenscout_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - screenscout_net

volumes:
  postgres_data:
  redis_data:

networks:
  screenscout_net:
    driver: bridge
