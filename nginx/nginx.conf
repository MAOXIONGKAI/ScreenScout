events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstreams
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    # 1. HTTP Server (Port 80)
    server {
        listen 80;
        server_name www.screenscout.live screenscout.live localhost _;

        # ACME Challenge for Certbot verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Next.js static files caching
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
        }

        # Backend API routes
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Frontend Application / Redirect
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 2. HTTPS Server (Port 443 SSL/TLS)
    server {
        listen 443 ssl;
        server_name www.screenscout.live screenscout.live;

        ssl_certificate     /etc/letsencrypt/live/screenscout.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/screenscout.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Next.js static files caching
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
        }

        # Backend API routes
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Frontend Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
