services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: screenscout_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: screenscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
