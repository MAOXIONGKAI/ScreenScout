services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: screenscout_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: screenscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenscout"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper-base: &scraper-base
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/screenscout
    depends_on:
      postgres:
        condition: service_healthy

  scrape-cinemas:
    <<: *scraper-base
    command: python movie_scraping/cinemas/main.py

  scrape-movies:
    <<: *scraper-base
    command: python movie_scraping/movies_and_schedules/main.py

  scrape-gv:
    <<: *scraper-base
    command: sh -c "python movie_scraping/cinemas/main.py --provider gv && python movie_scraping/movies_and_schedules/main.py --provider gv"

  scrape-shaw:
    <<: *scraper-base
    command: sh -c "python movie_scraping/cinemas/main.py --provider shaw && python movie_scraping/movies_and_schedules/main.py --provider shaw"

  clean-db:
    <<: *scraper-base
    command: python movie_scraping/clean/main.py

  run-all:
    <<: *scraper-base
    command: sh -c "python movie_scraping/cinemas/main.py && python movie_scraping/movies_and_schedules/main.py && python movie_scraping/clean/main.py"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: screenscout_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/screenscout
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screenscout_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
