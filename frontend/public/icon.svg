<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b2a"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" child="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="10"/>

  <!-- Cinema Clapperboard / Scout Logo -->
  <g>
    <!-- Clapper Lower Board Body -->
    <rect x="110" y="224" width="292" height="176" rx="24" fill="url(#purpleGrad)"/>

    <!-- Clapperboard Top Open Arm -->
    <g transform="rotate(-15 110 210)">
      <rect x="96" y="148" width="310" height="66" rx="18" fill="url(#purpleGrad)"/>
      <!-- Diagonal Clapper Stripes -->
      <polygon points="146,148 180,148 152,214 118,214" fill="#ffffff" opacity="0.95"/>
      <polygon points="220,148 254,148 226,214 192,214" fill="#ffffff" opacity="0.95"/>
      <polygon points="294,148 328,148 300,214 266,214" fill="#ffffff" opacity="0.95"/>
      <polygon points="368,148 396,148 374,214 340,214" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Center Play/Scout Icon -->
    <polygon points="230,268 230,356 306,312" fill="#ffffff" opacity="0.98"/>
    <!-- Scout Sparkle Star -->
    <circle cx="342" cy="272" r="14" fill="url(#accentGrad)"/>
  </g>
</svg>
