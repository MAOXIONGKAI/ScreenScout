name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Go Backend Tests & Quality Checks
  # ==========================================
  backend-tests:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  # ==========================================
  # 2. Python Notification & Monitor Tests
  # ==========================================
  python-tests:
    name: Python Service & Monitor Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Notification Service Unit Tests
        run: python -m unittest discover -s notification_service/tests -p "test_*.py"

      - name: Run Monitor & Subscription Checker Unit Tests
        run: python -m unittest discover -s movie_scraping/tests -p "test_*.py"

  # ==========================================
  # 3. Next.js Frontend Verification & Build
  # ==========================================
  frontend-tests:
    name: Next.js Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

  # ==========================================
  # 4. Continuous Deployment (CD to Production)
  # ==========================================
  deploy:
    name: Continuous Deployment (Linux Server)
    needs: [backend-tests, python-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            echo "========================================================"
            echo "🚀 Starting ScreenScout Production Auto-Deployment..."
            echo "========================================================"
            
            # Navigate to project directory
            cd ~/ScreenScout || cd /home/${{ secrets.USERNAME }}/ScreenScout
            
            echo "📥 Fetching latest code from GitHub..."
            git pull origin main
            
            echo "🏗️ Building production containers sequentially to conserve memory and CPU..."
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml build notification-service
            docker compose -f docker-compose.prod.yml build frontend
            
            echo "🚀 Launching updated ScreenScout services..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f || true
            
            echo "========================================================"
            echo "🎉 Continuous Deployment Completed Successfully!"
            echo "========================================================"
