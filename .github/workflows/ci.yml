name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Go Backend Tests & Quality Checks
  # ==========================================
  backend-tests:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  # ==========================================
  # 2. Python Notification & Monitor Tests
  # ==========================================
  python-tests:
    name: Python Service & Monitor Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Notification Service Unit Tests
        run: python -m unittest discover -s notification_service/tests -p "test_*.py"

      - name: Run Monitor & Subscription Checker Unit Tests
        run: python -m unittest discover -s movie_scraping/tests -p "test_*.py"

  # ==========================================
  # 3. Next.js Frontend Verification & Build
  # ==========================================
  frontend-tests:
    name: Next.js Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
